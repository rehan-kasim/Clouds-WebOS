<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clouds</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="h-screen overflow-hidden bg-slate-700 bg-[url('wallpapers/wallpaper1.jpg')] bg-cover bg-center bg-no-repeat text-slate-900 select-none">
    <div id="desktop" class="h-full w-full relative">

        <!-- Boot Screen Overlay -->
        <div id="boot-screen" class="absolute inset-0 bg-black flex flex-col items-center justify-center text-white z-50 transition-opacity duration-700">
            <div class="text-center">
                <img src="icons/Start.svg" alt="Clouds Logo" width="100" height="100">
                <h1 class="text-3xl font-light tracking-widest mb-4">CLOUDS</h1>
                <div class="w-48 h-1.5 bg-gray-800 rounded-full overflow-hidden mx-auto">
                    <div id="boot-progress" class="w-0 h-full bg-blue-500 transition-all duration-100 ease-out"></div>
                </div>
            <p id="boot-status" class="text-xs text-gray-500 mt-3 font-mono">Starting system...</p>
            </div>
        </div>

        <!--widgets-->
        <!--clock widget-->
        <div class="rounded-full w-80 h-40 bg-white/10 backdrop-blur-xl absolute top-4 right-4 flex flex-col items-center justify-center p-4 z-40 hover:border-2 transition hover:bg-white/20 hover:border-amber-100">
            <p class="text-2xl text-white">Date & Time</p>
            <p id="widget-date" class="text-4xl text-white">1 Jan 2026</p>
            <p id="widget-time" class="text-4xl text-white">10:00 AM</p>
        </div>

        <!-- Task Bar -->
        <div id="taskbar" class="absolute bottom-0 left-0 w-full h-12 bg-gray-800 flex items-center justify-between px-4 bg-gradient-to-br from-gray-800 to-gray-900 z-40">
            
            <!-- Start Button -->
            <div id="start-menu-button" class="text-white cursor-pointer border border-gray-600 rounded-full px-2.5 py-1.5 hover:bg-gray-700 transition">
                <img src="icons/Start.svg" alt="Start" class="h-5 w-5">
            </div>

            <!-- Start Menu -->
            <div id="start-menu" class="hidden absolute bottom-14 left-4 w-72 bg-gray-900/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-700 text-white overflow-hidden z-50">
                <div class="p-4 border-b border-gray-700">
                    <h2 class="text-lg font-semibold">Clouds OS</h2>
                    <p class="text-xs text-gray-400">Welcome back!</p>
                </div>
                
                <!-- Search Bar -->
                <div class="p-4">
                    <input type="text" placeholder="Search..." class="w-full bg-gray-800 text-gray-200 placeholder:text-gray-500 border border-gray-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Pinned Apps Section -->
                <div class="p-4 border-t border-gray-700">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Pinned</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <div onclick="openApp('calculator')" class="flex flex-col items-center cursor-pointer hover:bg-gray-800 p-2 rounded transition">
                            <img src="icons/calculator-icon.svg" alt="Calculator" class="w-8 h-8 mb-1">
                            <span class="text-xs">Calc</span>
                        </div>
                        <div onclick="openApp('settings')" class="flex flex-col items-center cursor-pointer hover:bg-gray-800 p-2 rounded transition">
                            <img src="icons/settings-icon.svg" alt="Settings" class="w-8 h-8 mb-1">
                            <span class="text-xs">Settings</span>
                        </div>
                        <div onclick="openApp('weather-app')" class="flex flex-col items-center cursor-pointer hover:bg-gray-800 p-2 rounded transition">
                            <img src="icons/weather-icon.svg" alt="Weather" class="w-8 h-8 mb-1">
                            <span class="text-xs">Weather</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Taskbar Icons -->
            <div id="taskbar-icons" class="flex space-x-2">
                <button data-app="calculator" onclick="openApp('calculator')" class="hover:bg-gray-700 p-1.5 rounded transition" style="position:relative;">
                    <img src="icons/calculator-icon.svg" alt="Calculator" class="w-8 h-6">
                    <span class="indicator" style="position:absolute;bottom:1px;left:50%;margin-left:-8px;width:16px;height:2px;border-radius:2px;background:#fff;opacity:0;transition:opacity .3s;pointer-events:none;"></span>
                </button>
                <button data-app="settings" onclick="openApp('settings')" class="hover:bg-gray-700 p-1.5 rounded transition" style="position:relative;">
                    <img src="icons/settings-icon.svg" alt="Settings" class="w-8 h-6">
                    <span class="indicator" style="position:absolute;bottom:1px;left:50%;margin-left:-8px;width:16px;height:2px;border-radius:2px;background:#fff;opacity:0;transition:opacity .3s;pointer-events:none;"></span>
                </button>
                <button data-app="weather-app" onclick="openApp('weather-app')" class="hover:bg-gray-700 p-1.5 rounded transition" style="position:relative;">
                    <img src="icons/weather-icon.svg" alt="Weather" class="w-8 h-6">
                    <span class="indicator" style="position:absolute;bottom:1px;left:50%;margin-left:-8px;width:16px;height:2px;border-radius:2px;background:#fff;opacity:0;transition:opacity .3s;pointer-events:none;"></span>
                </button>
                <!--Date & Time-->
                <div class="hover:border-2 hover:border-gray-600 px-2 py-1 rounded transition flex flex-col items-center border-2 border-gray-800">
                    <p id="date" class="date text-xs text-gray-400">1 Jan 2026</p>
                    <p id="time" class="time text-xs text-gray-400">10:00 AM</p>
                </div>
            </div>

        <!-- Apps Workspace -->
        <div id="apps">
            <!--Weather App-->
            <div id="weather-app" class="main-window hidden flex flex-col absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-60 bg-gray-900/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-700 text-white z-30 overflow-hidden">
                <!--Window Header-->
                <div class="window-header flex justify-between items-center px-3 py-2 bg-gray-800/80 border-b border-gray-700 cursor-move">
                    <span class="text-xs font-semibold text-gray-300">Weather App</span>
                    <div class="flex items-center space-x-2 text-xs">
                        <button onclick="minimize('weather-app')" class="hover:bg-gray-700 px-2 py-0.5 rounded text-gray-400 hover:text-white">-</button>
                        <button onclick="maximize('weather-app')" class="hover:bg-gray-700 px-2 py-0.5 rounded text-gray-400 hover:text-white">□</button>
                        <button onclick="closeApp('weather-app')" class="hover:bg-red-600 px-2 py-0.5 rounded text-gray-400 hover:text-white">✕</button>
                    </div>
                </div>
                <!--Weather App Body-->
                <div class="flex flex-1 w-auto flex-col items-center justify-center gap-2 rounded-lg bg-gray-700 p-6 text-center shadow-lg" id="weatherInfo">
                    <h1 id="CityName" class="text-3xl text-white font-bold">Delhi</h1>
                    <h2 id="temperatureinfo" class="text-4xl text-white font-bold ">10°C</h2>
                    <h3 id="humidityinfo" class="text-lg font-semibold text-white ">Humidity: 60%</h3>
                    <h3 id="skyinfo" class="text-lg font-semibold text-white ">Sky: Sunny</h3>
                    <h1 id="emojiinfo" class="text-5xl">🌞</h1>
                </div>
            </div>

            <!--Settings App-->
            <div id="settings" class="main-window hidden flex flex-col absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 bg-gray-900/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-700 text-white z-30 overflow-hidden">
                <!-- Window Header -->
                <div class="window-header flex justify-between items-center px-3 py-2 bg-gray-800/80 border-b border-gray-700 cursor-move">
                    <span class="text-xs font-semibold text-gray-300">Settings</span>
                    <div class="flex items-center space-x-2 text-xs">
                        <button onclick="minimize('settings')" class="hover:bg-gray-700 px-2 py-0.5 rounded text-gray-400 hover:text-white">-</button>
                        <button onclick="maximize('settings')" class="hover:bg-gray-700 px-2 py-0.5 rounded text-gray-400 hover:text-white">□</button>
                        <button onclick="closeApp('settings')" class="hover:bg-red-600 px-2 py-0.5 rounded text-gray-400 hover:text-white">✕</button>
                    </div>
                </div>

                <!-- Settings Body -->
                <div class="p-4">
                    <p>Choose Wallpaper</p>
                    <button class="cursor-pointer" onclick="setWallpaper('wallpapers/wallpaper1.jpg')"><img src="wallpapers/wallpaper1.jpg" width="100"></button>
                    <button class="cursor-pointer" onclick="setWallpaper('wallpapers/wallpaper2.jpg')"><img src="wallpapers/wallpaper2.jpg" width="100"></button>
                    <button class="cursor-pointer" onclick="setWallpaper('wallpapers/wallpaper3.jpg')"><img src="wallpapers/wallpaper3.jpg" width="100"></button>
                    <button class="cursor-pointer" onclick="setWallpaper('wallpapers/wallpaper4.jpg')"><img src="wallpapers/wallpaper4.jpg" width="100"></button>
                    <button class="cursor-pointer" onclick="setWallpaper('wallpapers/wallpaper5.jpg')"><img src="wallpapers/wallpaper5.jpg" width="100"></button>
                </div>

            </div>

            <!-- Calculator App Window -->
            <div id="calculator" class="main-window hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-72 bg-gray-900/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-700 text-white z-30 overflow-hidden">
                <!-- Window Header -->
                <div class="window-header flex justify-between items-center px-3 py-2 bg-gray-800/80 border-b border-gray-700 cursor-move">
                    <span class="text-xs font-semibold text-gray-300">Calculator</span>
                    <div class="flex items-center space-x-2 text-xs">
                        <button onclick="minimize('calculator')" class="hover:bg-gray-700 px-2 py-0.5 rounded text-gray-400 hover:text-white">-</button>
                        <button onclick="maximize('calculator')" class="hover:bg-gray-700 px-2 py-0.5 rounded text-gray-400 hover:text-white">□</button>
                        <button onclick="closeApp('calculator')" class="hover:bg-red-600 px-2 py-0.5 rounded text-gray-400 hover:text-white">✕</button>
                    </div>
                </div>

                <!-- Calculator Body -->
                <div class="p-4">
                    <input type="text" id="calculator-display" class="w-full h-12 text-right px-3 text-2xl font-mono border border-gray-700 rounded bg-gray-950 text-white mb-4 focus:outline-none" readonly>
                    
                    <div id="NumPad" class="grid grid-cols-4 gap-2">
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="cleardisplay()">C</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('/')">/</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('*')">×</button>
                        <button class="bg-red-900/50 hover:bg-red-800/60 text-red-200 py-3 rounded text-lg font-medium transition" onclick="deleteLastChar()">⌫</button>

                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('7')">7</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('8')">8</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('9')">9</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('-')">-</button>

                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('4')">4</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('5')">5</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('6')">6</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('+')">+</button>

                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('1')">1</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('2')">2</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('3')">3</button>
                        <button class="row-span-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-lg font-medium transition" onclick="calculate()">=</button>

                        <button class="col-span-2 bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('0')">0</button>
                        <button class="bg-gray-800 hover:bg-gray-700 py-3 rounded text-lg font-medium transition" onclick="appendtodisplay('.')">.</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
